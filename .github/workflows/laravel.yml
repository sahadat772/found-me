name: Found Me CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Code checkout করো
      uses: actions/checkout@v3

    - name: PHP setup করো
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Dependencies install করো
      run: composer install

    - name: .env বানাও
      run: cp .env.example .env

    - name: App key বানাও
      run: php artisan key:generate

    - name: Code সঠিক আছে কিনা check করো
      run: php artisan route:list